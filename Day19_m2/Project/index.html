<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Addis Market</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Welcome to Addis Market Shopping List</h1>
    <form id="add-form">
      <input id="name" type="text" placeholder="Item name" />
      <input id="price" type="number" placeholder="Price in ETB" />
      <button type="submit">Add Item</button>
    </form>
    <ul id="list"></ul>
    <h2>Total: <span id="total">0</span> ETB</h2>

    <script src="app.js"></script>
  </body>
</html>
